<script>
// ゲーム画面を「実際に見えている領域」(visualViewport) ぴったりに合わせる。
// LINE内ブラウザやiOS Safariのツールバーで 100dvh がずれて画面端が隠れる問題への対策。
function fitView(){
  const vv=window.visualViewport;
  const w=vv?vv.width:window.innerWidth,h=vv?vv.height:window.innerHeight;
  const x=vv?vv.offsetLeft:0,y=vv?vv.offsetTop:0;
  const els=[document.getElementById('g'),document.getElementById('hv')];
  document.querySelectorAll('.vfit').forEach(el=>els.push(el));
  els.forEach(el=>{if(!el)return;el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px'});
}
if(window.visualViewport){visualViewport.addEventListener('resize',fitView);visualViewport.addEventListener('scroll',fitView)}
window.addEventListener('resize',fitView);
window.addEventListener('orientationchange',fitView);
fitView();
const Z=[...document.querySelectorAll('.z')],B=document.getElementById('start');
let total=[0,0,0,0],hand=null,up=null;
Z.forEach((z,i)=>{z.addEventListener('pointerdown',e=>{e.preventDefault();if(ONLINE&&i!==myIdx)return;hand&&hand(i,e)});
z.addEventListener('pointerup',e=>{if(ONLINE&&i!==myIdx)return;up&&up(i,e)});z.addEventListener('pointercancel',e=>{if(ONLINE&&i!==myIdx)return;up&&up(i,e)})});
const set=(i,m)=>Z[i].querySelector('.m').textContent=m;
const all=m=>Z.forEach((_,i)=>set(i,m));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const upd=()=>Z.forEach((z,i)=>z.querySelector('.s').textContent=total[i]+'点');
const until=async(f,ms)=>{const s=performance.now();while(!f()&&performance.now()-s<ms)await sleep(30)};
async function cd(t,r){all(t+'\n'+r);const ms=Z.map(z=>z.querySelector('.m'));ms.forEach(m=>m.classList.add('ins'));await sleep(3500);ms.forEach(m=>m.classList.remove('ins'));for(const n of[3,2,1]){all(n);await sleep(700)}}
async function award(v){
  const idx=[0,1,2,3].sort((a,b)=>v[a]-v[b]),p=[3,2,1,0];
  idx.forEach((pl,k)=>{const rk=v.filter(x=>x<v[pl]).length;total[pl]+=p[rk];set(pl,(rk+1)+'位\n+'+p[rk]+'点')});
  upd();await sleep(2500);
}
async function reaction(){
  await cd('⚡反射神経','合図で即タップ!\nフライングは失格');
  all('待て…');const res=[null,null,null,null];let t0=null;
  const done=()=>res.every(r=>r!==null);
  hand=i=>{if(res[i]!==null)return;
    if(t0===null){res[i]=Infinity;set(i,'フライング!')}
    else{res[i]=performance.now()-t0;set(i,Math.round(res[i])+'ms')}};
  await sleep(2000+Math.random()*3000);
  if(!done()){t0=performance.now();Z.forEach((z,i)=>{z.classList.add('go');if(res[i]===null)set(i,'今!')});await until(done,3000)}
  hand=null;Z.forEach(z=>z.classList.remove('go'));
  res.forEach((r,i)=>{if(r===null){res[i]=Infinity;set(i,'遅い…')}});
  await sleep(1000);await award(res);
}
async function mash(){
  await cd('👊連打バトル','8秒間で一番連打した人が勝ち');
  const c=[0,0,0,0];all('0');hand=i=>{c[i]++;set(i,c[i])};
  await sleep(8000);hand=null;all('終了!');await sleep(1000);await award(c.map(x=>-x));
}
async function stop(){
  await cd('⏱ぴったりストップ','5.00秒でタップ!\n途中から数字が消える');
  const r=[null,null,null,null];const t0=performance.now();
  hand=i=>{if(r[i]!==null)return;const t=(performance.now()-t0)/1000;r[i]=Math.abs(t-5);set(i,t.toFixed(2)+'秒\n差 '+r[i].toFixed(2))};
  const s=performance.now();
  while(!r.every(x=>x!==null)&&performance.now()-s<10000){
    const t=(performance.now()-t0)/1000;
    r.forEach((x,i)=>{if(x===null)set(i,t<1.5?t.toFixed(2):'？')});await sleep(50)}
  hand=null;r.forEach((x,i)=>{if(x===null)r[i]=Infinity});
  await sleep(1000);await award(r);
}
async function bomb(){
  await cd('💣チキンレース','数字が増える!爆発前にタップで獲得\n爆発後は0点');
  const r=[null,null,null,null];let v=0;const lim=30+Math.floor(Math.random()*90);
  hand=i=>{if(r[i]!==null)return;r[i]=v;set(i,'確保!\n'+v)};
  all(0);
  while(v<lim&&!r.every(x=>x!==null)){v++;r.forEach((x,i)=>{if(x===null)set(i,v)});await sleep(100)}
  hand=null;
  r.forEach((x,i)=>{if(x===null){r[i]=0;set(i,'💥爆発!\n0')}});
  await sleep(1200);await award(r.map(x=>-x));
}
async function exact(){
  const n=15+Math.floor(Math.random()*11);
  await cd('🎯ぴったりタップ',n+'回ちょうど!\n5秒間・回数は見えない');
  const c=[0,0,0,0];all('GO!');hand=i=>{c[i]++;set(i,'👆')};
  await sleep(5000);hand=null;all('終了!');await sleep(800);
  Z.forEach((z,i)=>set(i,c[i]+'回\n差 '+Math.abs(c[i]-n)));
  await sleep(1500);await award(c.map(x=>Math.abs(x-n)));
}
async function fake(){
  await cd('🃏だまし合図','「今!」の時だけタップ\nニセ合図に注意');
  all('待て…');const res=[null,null,null,null];let t0=null;
  const done=()=>res.every(r=>r!==null);
  hand=i=>{if(res[i]!==null)return;if(t0===null){res[i]=Infinity;set(i,'だまされた!')}else{res[i]=performance.now()-t0;set(i,Math.round(res[i])+'ms')}};
  const fk=['押せ!','ゴー!','スタート!','いけ!'];
  const n=3+Math.floor(Math.random()*2);
  for(let k=0;k<n;k++){await sleep(1000+Math.random()*1200);Z.forEach((z,i)=>{if(res[i]===null)set(i,fk[Math.floor(Math.random()*4)])});await sleep(600);Z.forEach((z,i)=>{if(res[i]===null)set(i,'待て…')})}
  await sleep(800+Math.random()*1500);
  if(!done()){t0=performance.now();Z.forEach((z,i)=>{z.classList.add('go');if(res[i]===null)set(i,'今!')});await until(done,3000)}
  hand=null;Z.forEach(z=>z.classList.remove('go'));
  res.forEach((r,i)=>{if(r===null){res[i]=Infinity;set(i,'遅い…')}});
  await sleep(1000);await award(res);
}
async function sg(){
  await cd('🚦ストップ&ゴー','緑のときだけ連打!\n赤で押すと-2点');
  const c=[0,0,0,0];let g=true;
  const d=i=>{set(i,(g?'🟢連打!\n':'🔴止まれ!\n')+c[i]);Z[i].classList.toggle('go',g)};
  hand=i=>{c[i]+=g?1:-2;d(i)};
  Z.forEach((z,i)=>d(i));
  const s=performance.now();
  while(performance.now()-s<10000){await sleep(700+Math.random()*1300);g=!g;Z.forEach((z,i)=>d(i))}
  hand=null;Z.forEach(z=>z.classList.remove('go'));all('終了!');
  await sleep(1000);await award(c.map(x=>-x));
}
async function roul(){
  await cd('🎰ルーレット','数字が高速で変わる!\nタップで止めて大きい数字が勝ち\n6秒以内に止めないと0');
  const v=[0,0,0,0],r=[false,false,false,false];
  hand=i=>{if(!r[i]){r[i]=true;set(i,'🔒\n'+v[i])}};
  const s=performance.now();
  while(!r.every(x=>x)&&performance.now()-s<6000){
    v.forEach((x,i)=>{if(!r[i]){v[i]=1+Math.floor(Math.random()*9);set(i,v[i])}});await sleep(80)}
  hand=null;r.forEach((x,i)=>{if(!x){v[i]=0;set(i,'時間切れ\n0')}});
  await sleep(1200);await award(v.map(x=>-x));
}
async function mole(){
  await cd('🐹もぐらたたき','出てきたもぐらをタップ!\n8秒で多く叩いた人が勝ち');
  const c=[0,0,0,0],ts=[];
  const mv=t=>{t.style.left=(10+Math.random()*60)+'%';t.style.top=(18+Math.random()*45)+'%'};
  Z.forEach((z,i)=>{for(let q=0;q<3;q++){const t=document.createElement('div');t.className='t';t.textContent='🐹';mv(t);

const shuf=a=>a.sort(()=>Math.random()-.5);
async function nums(){
  await cd('🔢数字タップ','1→6の順にタップ!\n早く終えた人が勝ち');
  const t=[null,null,null,null],nx=[1,1,1,1],gs=[];const s=performance.now();
  Z.forEach((z,i)=>{set(i,'つぎ: 1');const g=document.createElement('div');g.className='o g';
    shuf([1,2,3,4,5,6]).forEach(n=>{const b=document.createElement('b');b.textContent=n;
      b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();
        if(n!==nx[i]||t[i]!==null)return;b.style.opacity=.2;nx[i]++;
        if(nx[i]>6){t[i]=performance.now()-s;set(i,'✔ '+(t[i]/1000).toFixed(2)+'秒')}else set(i,'つぎ: '+nx[i])});
      g.appendChild(b)});z.appendChild(g);gs.push(g)});
  await until(()=>t.every(x=>x!==null),15000);
  gs.forEach(g=>g.remove());t.forEach((x,i)=>{if(x===null){t[i]=Infinity;set(i,'時間切れ')}});
  await sleep(1200);await award(t);

async function calc(){
  await cd('🧮暗算ダッシュ','正解+1 / 不正解-1\n10秒間');
  const c=[0,0,0,0],os=[];const R=n=>1+Math.floor(Math.random()*n);
  const mk=i=>{const a=R(9),b=R(9),ans=a+b;set(i,a+' + '+b+'\n('+c[i]+')');
    const o=os[i];o.innerHTML='';
    shuf([ans,...shuf([ans-2,ans-1,ans+1,ans+2]).slice(0,2)]).forEach(v=>{const e=document.createElement('b');e.textContent=v;
      e.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();if(!live)return;c[i]+=v===ans?1:-1;mk(i)});o.appendChild(e)})};
  let live=true;
  Z.forEach((z,i)=>{const o=document.createElement('div');o.className='o';z.appendChild(o);os.push(o);mk(i)});
  await sleep(10000);live=false;os.forEach(o=>o.remove());
  Z.forEach((z,i)=>set(i,c[i]+'点'));await sleep(1200);await award(c.map(x=>-x));
}
async function gauge(){

  while(!r.every(x=>x)&&performance.now()-s<8000){
    const t=(performance.now()-s)/1000;

const CL=[['あか','#e5484d'],['あお','#2f6fe0'],['みどり','#1e8e4e'],['きいろ','#d9a400']];
const RR=n=>1+Math.floor(Math.random()*n);

  await sleep(10000);live=false;os.forEach(o=>o.remove());

async function hue(){
  await cd('👁色さがし','1つだけ色がちがう!\n当たり+1 / はずれ-1・10秒');
  const c=[0,0,0,0],gs=[];let live=true;

  Z.forEach((z,i)=>{const g=document.createElement('div');g.className='o g';z.appendChild(g);gs.push(g);mk(i)});
  await sleep(10000);live=false;gs.forEach(g=>g.remove());
  Z.forEach((z,i)=>set(i,c[i]+'点'));await sleep(1200);await award(c.map(x=>-x));

  const c=[0,0,0,0],os=[];let live=true;
  const mk=i=>{const ans=CL[RR(4)-1],m=Z[i].querySelector('.m');set(i,'■■■');

async function slow(){

  const code=$('codeIn').value.trim().toUpperCase();
  if(code.length!==6){$('mainMsg').textContent='6文字のコードを入力してください。';return}
  if(typeof Peer==='undefined'){$('mainMsg').textContent='通信ライブラリを読み込めませんでした。電波の良い場所でページを開き直してください。';return}
  cleanupPeer();ROLE='guest';ONLINE=true;$('mainMsg').textContent='接続中…';
  peer=new Peer();
  peer.on('open',()=>{hostConn=peer.connect(PREFIX+code,{reliable:true});
    hostConn.on('open',()=>{$('mainMsg').textContent='接続しました。ホストの応答を待っています…'});
    hostConn.on('data',onHostData);
    hostConn.on('close',()=>{if(ROLE==='guest')guestLeft()})});
  peer.on('error',e=>{$('mainMsg').textContent=e.type==='peer-unavailable'?'ルームが見つかりません。コードを確認してください。':'接続エラー（'+e.type+'）'})};
$('roomLeave').onclick=()=>{cleanupPeer();ROLE=null;ONLINE=false;playing=false;lastPlayers=[true,false,false,false];grid.classList.remove('online');$('lobbyRoom').style.display='none';$('lobbyMain').style.display='block';$('mainMsg').textContent='';showLobby(false);B.style.display='block';$('onlineBtn').style.display='block';setStatus('');$('hv').style.display='none'};
Z.forEach((z,i)=>{
  z.addEventListener('pointerdown',e=>{if(ROLE!=='guest'||!hostConn||!hostConn.open||i!==myIdx)return;const t=e.target.closest?e.target.closest('[data-path]'):null;if(t)hostConn.send({t:'el',path:t.dataset.path.split(',').map(Number)});else hostConn.send({t:'down',x:e.clientX,y:e.clientY})});
  z.addEventListener('pointerup',e=>{if(ROLE!=='guest'||!hostConn||!hostConn.open||i!==myIdx)return;hostConn.send({t:'up',x:e.clientX,y:e.clientY})});
  z.addEventListener('pointercancel',e=>{if(ROLE!=='guest'||!hostConn||!hostConn.open||i!==myIdx)return;hostConn.send({t:'up',x:e.clientX,y:e.clientY})})});
['pointerdown','pointermove','pointerup','pointercancel'].forEach(ty=>{$('hv').addEventListener(ty,e=>{if(ROLE!=='guest'||!hostConn||!hostConn.open)return;e.preventDefault();const r=$('hv').getBoundingClientRect();hostConn.send({t:'cv',phase:ty==='pointerdown'?'down':ty==='pointermove'?'move':'up',x:(e.clientX-r.left)/Math.max(1,r.width),y:(e.clientY-r.top)/Math.max(1,r.height)})})});
</script></body></html>
